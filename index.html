<title>ITCN Lead Capture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EEF1F6;
    --surface:#FFFFFF;
    --surface-2:#F6F8FB;
    --border:#DCE1EA;
    --text:#1A2233;
    --text-muted:#626B80;
    --accent:#2454C7;
    --accent-ink:#FFFFFF;
    --accent-soft:#E4EBFB;
    --hot-bg:#FBE7E2; --hot-fg:#B23A1E;
    --warm-bg:#FBF1DA; --warm-fg:#8A6412;
    --cold-bg:#E4EDF6; --cold-fg:#3C6489;
    --danger:#B23A1E;
    --shadow: 0 1px 2px rgba(20,25,40,.06), 0 8px 24px rgba(20,25,40,.05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10141C; --surface:#161B26; --surface-2:#1C2330;
      --border:#2A3242; --text:#E8EBF2; --text-muted:#93A0B5;
      --accent:#7096F2; --accent-ink:#0B1220; --accent-soft:#1D2A4A;
      --hot-bg:#3A2019; --hot-fg:#F3907A;
      --warm-bg:#332A14; --warm-fg:#EBC066;
      --cold-bg:#182636; --cold-fg:#8FB3D8;
      --danger:#F08A6E;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10141C; --surface:#161B26; --surface-2:#1C2330;
    --border:#2A3242; --text:#E8EBF2; --text-muted:#93A0B5;
    --accent:#7096F2; --accent-ink:#0B1220; --accent-soft:#1D2A4A;
    --hot-bg:#3A2019; --hot-fg:#F3907A;
    --warm-bg:#332A14; --warm-fg:#EBC066;
    --cold-bg:#182636; --cold-fg:#8FB3D8;
    --danger:#F08A6E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }

  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px);
    background:var(--surface); border-bottom:1px solid var(--border);
    z-index:10;
  }
  .topbar-inner{
    max-width:640px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark{
    width:36px; height:36px; border-radius:9px; flex:none;
    background:#FFFFFF; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    padding:4px;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .brand-text{ display:flex; flex-direction:column; min-width:0; }
  .brand-text strong{ font-size:13.5px; font-weight:600; line-height:1.25; }
  .brand-sub{ font-size:11.5px; color:var(--text-muted); }
  .topbar-stats{ display:flex; gap:14px; flex:none; }
  .stat{ text-align:center; }
  .stat span{ display:block; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:18px; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat label{ font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  .stat.hot span{ color:var(--hot-fg); }

  .content{ max-width:640px; margin:0 auto; padding:16px; padding-bottom:calc(32px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:16px; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px;
  }
  .card h2{ margin:0 0 14px; font-size:15px; font-weight:600; }

  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field-row .field{ margin-bottom:12px; }
  label{ font-size:12.5px; font-weight:500; color:var(--text-muted); }
  input, select, textarea{
    font:inherit; font-size:14.5px; color:var(--text);
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:9px 11px; width:100%;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea{ resize:vertical; min-height:44px; }
  select{ appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%); background-position:calc(100% - 18px) center, calc(100% - 13px) center; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:32px; }

  .btn-primary, .btn-secondary, .btn-ghost{
    font:inherit; font-weight:600; font-size:14px; border-radius:10px; border:1px solid transparent;
    padding:11px 16px; cursor:pointer; width:100%;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-secondary{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft); }
  .btn-ghost{ background:transparent; color:var(--text-muted); border-color:var(--border); }
  .export-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .hint{ font-size:11.5px; color:var(--text-muted); margin:10px 0 0; line-height:1.4; }

  .list-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .list-head h2{ margin:0; }
  .filter-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    font-size:12px; font-weight:600; border-radius:999px; padding:5px 11px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); cursor:pointer;
  }
  .chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .chip-hot{ } .chip-warm{ } .chip-cold{ }

  .lead-list{ display:flex; flex-direction:column; gap:10px; }
  .lead-card{ border:1px solid var(--border); border-radius:12px; padding:12px 13px; background:var(--surface-2); }
  .lead-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .lead-main{ display:flex; flex-direction:column; min-width:0; }
  .lead-name{ font-size:14.5px; font-weight:600; }
  .lead-company{ font-size:12.5px; color:var(--text-muted); }
  .chip-priority{ flex:none; }
  .chip-priority.Hot{ background:var(--hot-bg); color:var(--hot-fg); }
  .chip-priority.Warm{ background:var(--warm-bg); color:var(--warm-fg); }
  .chip-priority.Cold{ background:var(--cold-bg); color:var(--cold-fg); }
  .chip-priority.none{ background:var(--border); color:var(--text-muted); }
  .lead-meta{ margin-top:6px; font-size:12.5px; color:var(--text-muted); display:flex; flex-wrap:wrap; gap:5px; }
  .lead-notes{ margin:8px 0 0; font-size:13px; line-height:1.4; }
  .lead-foot{ margin-top:9px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .lead-whatsapp{ font-size:12.5px; font-weight:600; color:var(--accent); text-decoration:none; }
  .lead-time{ font-size:11px; color:var(--text-muted); font-family:"IBM Plex Mono",monospace; margin-left:auto; }
  .btn-delete{ font-size:11.5px; color:var(--danger); background:none; border:none; cursor:pointer; padding:2px 0; font-weight:600; }

  .empty-state{ text-align:center; color:var(--text-muted); font-size:13px; padding:18px 0; margin:0; }
  [hidden]{ display:none!important; }
</style>

        <div class="brand-text">
          <strong>Zeta CloudHub — ITCN Asia Lead Capture</strong>
          <span class="brand-sub">Sept 22–24</span>
        </div>
      </div>
      <div class="topbar-stats">
        <div class="stat"><span id="countTotal" class="mono">0</span><label>Leads</label></div>
        <div class="stat hot"><span id="countHot" class="mono">0</span><label>Hot</label></div>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="card form-card">
      <h2>New Lead</h2>
      <form id="leadForm">
        <div class="field">
          <label for="fName">Name</label>
          <input type="text" id="fName" name="name" required placeholder="Full name" autocomplete="off">
        </div>
        <div class="field">
          <label for="fCompany">Company</label>
          <input type="text" id="fCompany" name="company" placeholder="Organization" autocomplete="off">
        </div>
        <div class="field">
          <label for="fEmail">Email</label>
          <input type="email" id="fEmail" name="email" placeholder="name@company.com" autocomplete="off">
        </div>
        <div class="field">
          <label for="fWhatsapp">WhatsApp Number</label>
          <input type="tel" id="fWhatsapp" name="whatsapp" placeholder="+92 3xx xxxxxxx" autocomplete="off">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="fType">Type of Lead</label>
            <select id="fType" name="leadType">
              <option value="">Select…</option>
              <option>Bank</option>
              <option>Government / Public Sector</option>
              <option>Enterprise</option>
              <option>SME / Startup</option>
              <option>Student / Career Interest</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="fPriority">Priority</label>
            <select id="fPriority" name="priority">
              <option value="">Select…</option>
              <option>Hot</option>
              <option>Warm</option>
              <option>Cold</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="fInterest">What They're Looking For</label>
          <select id="fInterest" name="interest">
            <option value="">Select…</option>
            <option>Private Cloud (HyperNext)</option>
            <option>Public Cloud (Zeta CloudHub)</option>
            <option>Hybrid Cloud</option>
            <option>Consultancy</option>
            <option>TCO Assessment</option>
            <option>Technical Training</option>
            <option>Workshop</option>
            <option>Career / Information</option>
            <option>Not sure yet</option>
          </select>
        </div>
        <div class="field">
          <label for="fNextAction">Requested Next Action</label>
          <select id="fNextAction" name="nextAction">
            <option value="">Select…</option>
            <option>Schedule Discovery Call</option>
            <option>Technical Deep-Dive</option>
            <option>Send One-Pager</option>
            <option>Proposal / Quote Request</option>
            <option>Career / Internship Info</option>
            <option>No Action Needed</option>
          </select>
        </div>
        <div class="field">
          <label for="fNotes">Notes</label>
          <textarea id="fNotes" name="notes" rows="2" placeholder="What was discussed, next step…"></textarea>
        </div>
        <button type="submit" class="btn-primary" id="btnAdd">Add Lead</button>
      </form>
    </section>

    <section class="card list-card">
      <div class="list-head">
        <h2>Captured Leads</h2>
        <div class="filter-chips" id="filterChips">
          <button type="button" class="chip active" data-filter="all">All</button>
          <button type="button" class="chip" data-filter="Hot">Hot</button>
          <button type="button" class="chip" data-filter="Warm">Warm</button>
          <button type="button" class="chip" data-filter="Cold">Cold</button>
        </div>
      </div>
      <div id="leadList" class="lead-list"></div>
      <p id="emptyState" class="empty-state">No leads yet. First entry above.</p>
      <div class="export-row">
        <button type="button" class="btn-secondary" id="btnExport">Export to Excel</button>
        <button type="button" class="btn-ghost" id="btnClear">Clear all</button>
      </div>
      <p class="hint">Saved on this device only, works offline. Export anytime to an .xlsx file, then share it once you're back online.</p>
    </section>
  </main>
</div>

<script>
(function(){
  var STORAGE_KEY = "itcn2026_leads_v1";
  var leads = [];
  var activeFilter = "all";

  function loadLeads(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      leads = raw ? JSON.parse(raw) : [];
    }catch(e){ leads = []; }
  }
  function saveLeads(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(leads)); }catch(e){}
  }

  function fmtTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + ", " +
             d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    }catch(e){ return ""; }
  }

  function waHref(num){
    var digits = (num||"").replace(/[^0-9]/g,"");
    if(!digits) return "";
    return "https://wa.me/" + digits;
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function render(){
    var list = document.getElementById("leadList");
    var empty = document.getElementById("emptyState");
    var visible = leads.filter(function(l){
      return activeFilter === "all" || l.priority === activeFilter;
    });
    list.innerHTML = visible.slice().reverse().map(function(l){
      var pClass = l.priority || "none";
      var wa = waHref(l.whatsapp);
      var metaBits = [l.leadType, l.interest, l.nextAction].filter(Boolean);
      return '' +
        '<div class="lead-card" data-id="'+l.id+'">' +
          '<div class="lead-card-top">' +
            '<div class="lead-main">' +
              '<span class="lead-name">'+escapeHtml(l.name)+'</span>' +
              (l.company ? '<span class="lead-company">'+escapeHtml(l.company)+'</span>' : '') +
            '</div>' +
            '<span class="chip chip-priority '+pClass+'">'+(l.priority || "—")+'</span>' +
          '</div>' +
          (metaBits.length ? '<div class="lead-meta">'+metaBits.map(escapeHtml).join(' · ')+'</div>' : '') +
          (l.notes ? '<p class="lead-notes">'+escapeHtml(l.notes)+'</p>' : '') +
          '<div class="lead-foot">' +
            (wa ? '<a class="lead-whatsapp" href="'+wa+'" target="_blank" rel="noopener">WhatsApp</a>' : '') +
            (l.email ? '<a class="lead-whatsapp" href="mailto:'+encodeURIComponent(l.email).replace(/%40/g,"@")+'">Email</a>' : '') +
            '<span class="lead-time">'+fmtTime(l.ts)+'</span>' +
            '<button type="button" class="btn-delete" data-id="'+l.id+'">Remove</button>' +
          '</div>' +
        '</div>';
    }).join("");

    empty.hidden = leads.length !== 0;
    document.getElementById("countTotal").textContent = leads.length;
    document.getElementById("countHot").textContent = leads.filter(function(l){return l.priority==="Hot";}).length;

    Array.prototype.forEach.call(document.querySelectorAll(".btn-delete"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        leads = leads.filter(function(l){ return l.id !== id; });
        saveLeads(); render();
      });
    });
  }

  document.getElementById("leadForm").addEventListener("submit", function(e){
    e.preventDefault();
    var name = document.getElementById("fName").value.trim();
    if(!name) return;
    var lead = {
      id: "l" + Date.now() + Math.random().toString(36).slice(2,7),
      name: name,
      company: document.getElementById("fCompany").value.trim(),
      email: document.getElementById("fEmail").value.trim(),
      whatsapp: document.getElementById("fWhatsapp").value.trim(),
      leadType: document.getElementById("fType").value,
      priority: document.getElementById("fPriority").value,
      interest: document.getElementById("fInterest").value,
      nextAction: document.getElementById("fNextAction").value,
      notes: document.getElementById("fNotes").value.trim(),
      ts: new Date().toISOString()
    };
    leads.push(lead);
    saveLeads();
    document.getElementById("leadForm").reset();
    document.getElementById("fName").focus();
    render();
  });

  Array.prototype.forEach.call(document.querySelectorAll("#filterChips .chip"), function(chip){
    chip.addEventListener("click", function(){
      activeFilter = chip.getAttribute("data-filter");
      Array.prototype.forEach.call(document.querySelectorAll("#filterChips .chip"), function(c){
        c.classList.toggle("active", c === chip);
      });
      render();
    });
  });

  document.getElementById("btnClear").addEventListener("click", function(){
    if(leads.length === 0) return;
    if(!confirm("Remove all " + leads.length + " captured leads from this device? This can't be undone.")) return;
    leads = [];
    saveLeads(); render();
  });

  document.getElementById("btnExport").addEventListener("click", function(){
    if(leads.length === 0){ alert("No leads captured yet."); return; }
    exportExcel();
  });

  function csvCell(v){
    var s = (v === undefined || v === null) ? "" : String(v);
    if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function buildCsv(){
    var headers = ["Name","Company","Email","WhatsApp","Type of Lead","Priority","Looking For","Requested Next Action","Notes","Captured At"];
    var lines = [headers.map(csvCell).join(",")];
    leads.forEach(function(l){
      lines.push([l.name,l.company,l.email,l.whatsapp,l.leadType,l.priority,l.interest,l.nextAction,l.notes,fmtTime(l.ts)].map(csvCell).join(","));
    });
    return "﻿" + lines.join("\r\n");
  }

  async function exportExcel(){
    var btn = document.getElementById("btnExport");
    var originalText = btn.textContent;
    btn.textContent = "Preparing…";
    btn.disabled = true;
    try{
      var blob = new Blob([buildCsv()], {type:"text/csv;charset=utf-8"});

      var stamp = new Date().toISOString().slice(0,10);
      var filename = "itcn-leads-" + stamp + ".csv";
      var downloads = window.claude ? await window.claude.use("downloads") : null;
      if(downloads){
        await downloads.save({ filename: filename, data: blob });
      }else{
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename; a.rel = "noopener";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      }
      btn.textContent = "Saved";
      setTimeout(function(){ btn.textContent = originalText; btn.disabled = false; }, 1600);
    }catch(err){
      btn.textContent = (err && err.code === "declined") ? originalText : "Export failed";
      btn.disabled = false;
      if(!(err && err.code === "declined")){
        setTimeout(function(){ btn.textContent = originalText; }, 2200);
      }
    }
  }

  loadLeads();
  render();
})();
</script>
